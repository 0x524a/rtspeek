name: Release Dry Run

# The real Release workflow (release.yml) only triggers on version tags, so it
# can't be a branch-protection status check (it would never run on a PR commit).
# This workflow validates the same GoReleaser config on every push/PR to main -
# builds all binaries and Docker images, but never publishes anything - so a
# broken .goreleaser.yaml or Dockerfile is caught before merge, not at tag time.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  goreleaser-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: check

      - name: Dry-run release (binaries + Docker images, no publish)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --snapshot --clean --skip=publish
